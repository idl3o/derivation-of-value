---
layout: default
---
<header class="masthead">
  {% if page.eyebrow %}<div class="series">{{ page.eyebrow }}</div>{% endif %}
  <h1>{{ page.title }}</h1>
  {% if page.subtitle %}<div class="volume">{{ page.subtitle }}</div>{% endif %}
</header>

<article class="prose">
  {{ content }}
</article>

<nav class="return">
  <a href="{{ '/' | relative_url }}">↩ Return to contents</a>
</nav>
