title: "Derivation of Value"
description: "A working program in mechanism design and the philosophy of value."

# Project-page hosting at idl3o.github.io/derivation-of-value requires the
# baseurl prefix. If switching to a custom domain or user/org page, set to "".
baseurl: "/derivation-of-value"

# Every document lives in _papers/. Add a file there and it appears on the
# home page (sorted by `order`) and gets its own page — no other edits needed.
collections:
  papers:
    output: true

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

permalink: pretty

exclude:
  - README.md
  - .gitignore
  - vendor/
  - Gemfile
  - Gemfile.lock
  # Working examples, superseded drafts, and planning notes ship with the
  # source, not as site pages. (_archive and _plan are underscore-prefixed
  # and so already ignored; named here so the intent survives a refactor.)
  - code/
  - _archive/
  - _plan/
  # The changelog is a working record, read alongside the source rather than
  # served. Excluding it drops both outputs it used to produce: the rendered
  # page at /CHANGELOG/ and the raw copy at /CHANGELOG.md. Nothing on the site
  # links to either — the only link is in the repository README, which is
  # itself excluded and resolves on GitHub.
  - CHANGELOG.md
